# Single-binary Tempo for local development: traces live in the container and disappear with it
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    # /tmp is writable by the image's non-root user without preparing a volume
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks
