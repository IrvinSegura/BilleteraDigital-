name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers uses the Docker daemon preinstalled on GitHub-hosted runners
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload module documentation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spring-modulith-docs
          path: target/spring-modulith-docs

  docker-image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t digital-wallet:ci .
