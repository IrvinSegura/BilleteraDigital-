version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Java versions are upgraded on purpose, together with the pom and CI, and only to LTS releases
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
