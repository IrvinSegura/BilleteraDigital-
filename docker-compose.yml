# `docker compose up -d` starts the database for running the app from the IDE. Emails go out through Gmail with the
# credentials in .env (see .env.example).
# `docker compose --profile app up -d --build` also builds and runs the application container.
# `docker compose --profile observability up -d` adds Prometheus, Tempo and Grafana (http://localhost:3030).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: ${DB_OWNER_USER:-wallet_owner}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-wallet_owner_dev}
      DB_APP_USER: ${DB_APP_USER:-wallet_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-wallet_app_dev}
    ports:
      # 5433 on the host so it can run next to other local PostgreSQL instances
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: [app]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/wallet
      DB_OWNER_USER: ${DB_OWNER_USER:-wallet_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-wallet_owner_dev}
      DB_APP_USER: ${DB_APP_USER:-wallet_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-wallet_app_dev}
      # Local runs only: real deployments mount the keys and set JWT_PRIVATE_KEY_LOCATION / JWT_PUBLIC_KEY_LOCATION
      JWT_GENERATE_KEYS_IF_MISSING: "true"
      # Local runs only, the same development key as application-dev.yml; real deployments use their own secret
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-ZGV2LW9ubHktdHdvLWZhY3Rvci1rZXktMzItYnl0ZXM=}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Gmail with the credentials in .env (see .env.example)
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      EMAIL_FROM: ${EMAIL_FROM:-Digital Wallet <no-reply@wallet.local>}
      # Client app that opens the links in verification and password reset emails
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Simulated unless Stripe test keys are given, e.g. PAYMENT_PROVIDER=stripe with STRIPE_API_KEY=sk_test_...
      # and the STRIPE_WEBHOOK_SECRET printed by `stripe listen`
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulated}
      # Withdrawals are simulated: no real payout provider is integrated yet
      PAYOUT_PROVIDER: simulated
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Traces go to Tempo when the observability profile is running too
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      # Local runs only, the same one docker/observability/prometheus/prometheus.yml sends
      MANAGEMENT_SCRAPE_PASSWORD: ${MANAGEMENT_SCRAPE_PASSWORD:-scrape-dev-password}
      # Off locally, where the web app has no Turnstile site key; Cloudflare's test keys (sitekey
      # 1x00000000000000000000AA, secret 1x0000000000000000000000000000000AA) always pass if you want to try it
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    ports:
      - "8080:8080"
    # The management port (8081) stays inside the compose network, where Prometheus scrapes it

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Keeps the trace ids attached to latency samples, so Grafana can jump from a slow request to its trace
      - --enable-feature=exemplar-storage
    volumes:
      - ./docker/observability/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    # Lets Prometheus reach the app started from the IDE on Linux too (Docker Desktop resolves it on its own)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./docker/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    ports:
      # OTLP over HTTP, where the app started from the IDE sends its traces
      - "4318:4318"

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.4.14
    depends_on:
      - prometheus
      - tempo
    environment:
      # Local only: anonymous viewers can browse dashboards, the admin login still edits
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/digital-wallet.json
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    # 3030 on the host: 3000 is the web app's dev server, which the emailed links point to
    ports:
      - "3030:3000"

volumes:
  postgres-data:
