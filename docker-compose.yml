# `docker compose up -d` starts only the database for running the app from the IDE.
# `docker compose --profile app up -d --build` also builds and runs the application container.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: ${DB_OWNER_USER:-wallet_owner}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-wallet_owner_dev}
      DB_APP_USER: ${DB_APP_USER:-wallet_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-wallet_app_dev}
    ports:
      # 5433 on the host so it can run next to other local PostgreSQL instances
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: [app]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/wallet
      DB_OWNER_USER: ${DB_OWNER_USER:-wallet_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-wallet_owner_dev}
      DB_APP_USER: ${DB_APP_USER:-wallet_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-wallet_app_dev}
      # Local runs only: real deployments mount the keys and set JWT_PRIVATE_KEY_LOCATION / JWT_PUBLIC_KEY_LOCATION
      JWT_GENERATE_KEYS_IF_MISSING: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
