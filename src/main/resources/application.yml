spring:
  application:
    name: digital-wallet
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/wallet}
    username: ${DB_APP_USER:wallet_app}
    password: ${DB_APP_PASSWORD:wallet_app_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    placeholders:
      appRole: ${DB_APP_USER:wallet_app}
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  modulith:
    events:
      # Events are stored with the transaction that publishes them (outbox); listeners interrupted by a crash or
      # restart run again on startup, and finished publications are deleted to keep the table small
      republish-outstanding-events-on-restart: true
      completion-mode: delete
      # Publications stuck this long in one state (e.g. the instance died mid-listener) are marked failed, so the
      # retry job (wallet.events.retry) picks them up
      staleness:
        published: 10m
        processing: 10m
        resubmitted: 10m
  mail:
    # JavaMail waits forever by default; a hung mail server must fail the listener so it is retried later
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        # Health and info are public; the rest needs the ADMIN role unless served on a separate management port
        include: health, info, prometheus, modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # Emails are retried through the outbox; a mail server outage must not mark the whole service down
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets let Prometheus compute latency percentiles across instances
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 0.1

logging:
  pattern:
    correlation: "[%X{correlationId:-},%X{traceId:-},%X{spanId:-}] "

# SQL spans in traces (datasource-micrometer): connection spans show time waiting for the pool, query spans show
# row locks held by concurrent transfers. Parameter values are never recorded, they can hold personal data.
jdbc:
  includes: connection, query
  datasource-proxy:
    include-parameter-values: false

wallet:
  identity:
    jwt:
      issuer: digital-wallet
      access-token-ttl: 15m
      generate-keys-if-missing: false
    refresh-token-ttl: 7d
    lockout:
      max-failed-attempts: 5
      duration: 15m
    password:
      hash-strength: 12
    # Administrator created at startup when both are set; never promotes an existing user
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
    # Login families whose tokens have all expired
    refresh-token-cleanup:
      cron: "0 15 3 * * *"
    # Email links work once; a reset link is short-lived because whoever holds it can take over the account
    email-verification-ttl: 24h
    password-reset-ttl: 30m
    one-time-token-cleanup:
      cron: "0 20 3 * * *"
  accounts:
    limit-zone: America/Mexico_City
    # Money that may leave a wallet per local day (withdrawals + transfers sent)
    daily-outgoing-limit:
      MXN: 50000.00
      USD: 3000.00
    usage-cleanup:
      cron: "0 30 3 * * *"
      retention: 7d
  transfers:
    # Retries with the same key after this are treated as new requests
    idempotency-key-cleanup:
      cron: "0 45 3 * * *"
      retention: 24h
    # Pending withdrawals are sent again (provider down) or checked (payout on its way) by a job; the newest are
    # left alone for a while because the request that made them is still sending them
    payouts:
      check-interval: 1m
      retry-after: 1m
  ledger:
    reconciliation:
      cron: "0 5 * * * *"
  notifications:
    email:
      # smtp sends through spring.mail.*; log only writes a line, for environments without a mail server
      delivery: log
      from: Digital Wallet <no-reply@wallet.local>
      # Client app that opens email links (verify the address, reset the password) and posts their token to the API
      app-url: http://localhost:3000
    cleanup:
      cron: "0 0 4 * * *"
      retention: 90d
  payments:
    # simulated pays every checkout the moment it opens, so deposits complete within the request; stripe sends the
    # payer to Stripe Checkout (test keys work) and completes the deposit when Stripe's webhook confirms the payment
    provider: ${PAYMENT_PROVIDER:simulated}
    checkout-ttl: 30m
    # Client app page Stripe sends the payer back to, with ?payment=<deposit id>&result=success|cancel
    return-url: http://localhost:3000/deposits/return
    stripe:
      api-key: ${STRIPE_API_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      api-url: https://api.stripe.com
      signature-tolerance: 5m
      connect-timeout: 5s
      read-timeout: 20s
    # Settles payments whose webhook never arrived by asking the provider
    stale:
      check-interval: 5m
      abandon-after: 10m
      expiry-grace: 10m
    # Stripe redelivers an event for up to 3 days; ids are kept well past that so a late copy is still skipped
    webhook-event-cleanup:
      cron: "0 50 3 * * *"
      retention: 30d
  # Failed event listeners (audit, notifications, emails) are retried with exponential backoff
  events:
    retry:
      interval: 30s
      initial-backoff: 1m
      max-backoff: 1h
  # Background jobs; every instance schedules them, see each job for how duplicates are avoided
  scheduling:
    enabled: true
  rate-limit:
    enabled: true
    # First matching rule wins. Buckets refill gradually, e.g. 20 per minute is one every 3 seconds.
    rules:
      # Each one sends an email, so they are limited well below other auth requests to stop mail bombing
      - name: password-reset
        methods: [POST]
        paths: [/api/v1/auth/password-reset]
        key: ip
        capacity: 5
        period: 15m
      - name: email-verification
        methods: [POST]
        paths: [/api/v1/users/me/email-verification]
        key: user
        capacity: 3
        period: 15m
      # Unauthenticated, so counted per address; Stripe sends bursts from a few addresses and retries what is refused
      - name: payment-webhooks
        methods: [POST]
        paths: [/api/v1/payments/webhooks/**]
        key: ip
        capacity: 600
        period: 1m
      # Per address: slows credential stuffing and email enumeration across accounts (lockout covers one account)
      - name: auth
        methods: [POST]
        paths: [/api/v1/auth/**]
        key: ip
        capacity: 20
        period: 1m
      - name: money-movement
        methods: [POST]
        paths: [/api/v1/transfers, /api/v1/wallets/*/deposits, /api/v1/wallets/*/withdrawals]
        key: user
        capacity: 30
        period: 1m
      - name: api
        paths: [/api/**]
        key: user
        capacity: 300
        period: 1m
