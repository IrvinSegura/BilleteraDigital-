# Local development: Flyway migrates with the schema owner, the app connects with the restricted user
spring:
  flyway:
    user: ${DB_OWNER_USER:wallet_owner}
    password: ${DB_OWNER_PASSWORD:wallet_owner_dev}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  # Actuator on its own port, as in production, so the local Prometheus can scrape without a token
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  # Tempo from `docker compose --profile observability up -d`; while it is not running, exports fail with warnings
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

wallet:
  identity:
    jwt:
      # Temporary key pair per run: restarting the app logs everyone out
      generate-keys-if-missing: true
    admin:
      email: ${ADMIN_EMAIL:admin@wallet.local}
      password: ${ADMIN_PASSWORD:admin-dev-password}
