# Production: every secret comes from the environment, no defaults
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
  flyway:
    user: ${DB_OWNER_USER}
    password: ${DB_OWNER_PASSWORD}
  # Gmail by default (MAIL_USERNAME plus an app password as MAIL_PASSWORD); MAIL_HOST points elsewhere, e.g. a
  # transactional email provider's SMTP relay. STARTTLS is used whenever the server offers it
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  # Never published outside the private network; Prometheus and the orchestrator's probes use it
  server:
    port: ${MANAGEMENT_PORT:8081}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  # Traces are exported only when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set. Behind a load
  # balancer, set SERVER_FORWARD_HEADERS_STRATEGY=native so rate limits see the client address, not the balancer's.

logging:
  structured:
    format:
      console: ecs

wallet:
  management:
    # Prometheus sends it as HTTP Basic (user "prometheus"); without it the management port would hand metrics and
    # module details to anyone who reaches it
    scrape-password: ${MANAGEMENT_SCRAPE_PASSWORD}
  identity:
    # Turnstile keys from the Cloudflare dashboard; CAPTCHA_ENABLED=false only behind another bot protection
    captcha:
      enabled: ${CAPTCHA_ENABLED:true}
    jwt:
      # e.g. file:/run/secrets/jwt-private.pem (PKCS#8) and file:/run/secrets/jwt-public.pem (X.509)
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
      # Only for running the production image locally; real deployments must provide the keys
      generate-keys-if-missing: ${JWT_GENERATE_KEYS_IF_MISSING:false}
    # Base64 of 32 random bytes (`openssl rand -base64 32`); keep it with the other secrets, losing it disables
    # every authenticator app already set up
    two-factor:
      encryption-key: ${TWO_FACTOR_ENCRYPTION_KEY:}
  notifications:
    email:
      # smtp needs MAIL_HOST; log turns email off (e.g. a demo deployment without a mail server)
      delivery: ${EMAIL_DELIVERY:smtp}
      from: ${EMAIL_FROM}
      # Public address of the client app, e.g. https://wallet.example.com; email links point to it
      app-url: ${APP_URL}
  transfers:
    payouts:
      # No default: stp pays by SPEI (needs the STP_* variables), openpay through Openpay (the OPENPAY_* ones),
      # simulated sends no real money and is only for demo deployments
      provider: ${PAYOUT_PROVIDER:}
      stp:
        # No default either, so production never sends payouts to STP's demo: STP gives the URLs with the account
        orders-url: ${STP_ORDERS_URL:}
        query-url: ${STP_QUERY_URL:}
      openpay:
        # Required too, so production never pays from the sandbox: https://api.openpay.mx
        url: ${OPENPAY_URL:}
  payments:
    # stripe needs STRIPE_API_KEY and STRIPE_WEBHOOK_SECRET; simulated is only for demo deployments without real money
    provider: ${PAYMENT_PROVIDER:stripe}
    return-url: ${APP_URL}/deposits/return
