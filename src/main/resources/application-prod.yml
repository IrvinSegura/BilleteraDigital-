# Production: every secret comes from the environment, no defaults
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
  flyway:
    user: ${DB_OWNER_USER}
    password: ${DB_OWNER_PASSWORD}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  # Never published outside the private network; Prometheus and the orchestrator's probes use it
  server:
    port: ${MANAGEMENT_PORT:8081}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  # Traces are exported only when MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT is set. Behind a load
  # balancer, set SERVER_FORWARD_HEADERS_STRATEGY=native so rate limits see the client address, not the balancer's.

logging:
  structured:
    format:
      console: ecs

wallet:
  identity:
    jwt:
      # e.g. file:/run/secrets/jwt-private.pem (PKCS#8) and file:/run/secrets/jwt-public.pem (X.509)
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
      # Only for running the production image locally; real deployments must provide the keys
      generate-keys-if-missing: ${JWT_GENERATE_KEYS_IF_MISSING:false}
